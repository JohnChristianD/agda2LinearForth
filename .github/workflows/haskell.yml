name: build
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: agda2mallpforth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: strict-mallp-gforth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository shape and upstream provenance
        env:
          SCHEME_UPSTREAM_SHA: 24e02d9669f17d98ec67b8ad961cf9c3e602bf10
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FLIB_UPSTREAM_BLOB: e27c965767845678ac1b157b5fcffebe910fbfe4
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          while IFS= read -r path; do
            test "$path" = "src/Agda/Compiler/ToForth.hs" && continue
            git cat-file -e "$SCHEME_UPSTREAM_SHA:$path"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SCHEME_UPSTREAM_SHA:$path")"
          done < <(git ls-tree -r --name-only HEAD | grep -E "\\.hs$")
          test "$(git ls-files '*.hs' | grep -v '^src/Agda/Compiler/ToForth.hs$' | wc -l | tr -d ' ')" -ge 1
          test "$(git ls-files '*.agda' | paste -sd ' ')" = "formal/MALLPForth.agda formal/SovereignRationalSEDPhysics.agda"
          expected_markdown_files="README.md"
          actual_markdown_files="$(git ls-files '*.md' | LC_ALL=C sort)"
          test "$actual_markdown_files" = "$expected_markdown_files"
          test -z "$(git ls-files '*.sh' '*.bash' '*.ps1')"
          test -f cabal.project
          grep -Fq 'tag: v2.8.0.2' cabal.project
          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse "$FORTH_UPSTREAM_SHA:data/FLib.fth")" = "$FLIB_UPSTREAM_BLOB"
          grep -Fq 'MALLP-CHECK-NAT { value -- }' data/FLib.fth

      - name: Install native linker and Gforth
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-gold gforth
          command -v ld
          ld --version
          printf 'int main(void) { return 0; }\n' | gcc -fuse-ld=gold -x c -o "$RUNNER_TEMP/gold-linker-smoke" -

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.10.3.0'
          cabal-update: false

      - name: Restore Cabal and local build caches
        id: build_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', 'agda2forth.cabal') }}-local-build-v2
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-

      - name: Build the stable Agda CLI
        id: agda_cli
        run: |
          cabal update
          cabal build Agda:exe:agda
          agda_bin="$(cabal list-bin Agda:exe:agda)"
          test -x "$agda_bin"
          test "$("$agda_bin" --numeric-version)" = "2.8.0.2"
          echo "AGDA_BIN=$agda_bin" >> "$GITHUB_ENV"

      - name: Save Cabal and local build caches
        if: always() && steps.agda_cli.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', 'agda2forth.cabal') }}-local-build-v2

      # The Forth token algebra and canonical renderer are in MALLPForth.agda.
      - name: Type-check MALLP, rewrite system, and integrated Forth renderer
        id: mallp_proof
        continue-on-error: true
        run: |
          "$AGDA_BIN" --no-prop --no-erasure -i formal formal/MALLPForth.agda

      - name: Type-check the separate RSED physics specification
        id: physics_proof
        continue-on-error: true
        run: |
          "$AGDA_BIN" --no-prop --no-erasure -i formal formal/SovereignRationalSEDPhysics.agda

      - name: Build the Haskell Forth backend
        id: forth_backend
        continue-on-error: true
        run: |
          cabal build agda2forth

      - name: Compile strict MALLP source and emit Forth
        id: forth_emit
        if: steps.forth_backend.outcome == 'success'
        run: |
          cp test/MALLPStrict.agda.src test/MALLPStrict.agda
          if ! cabal run agda2forth -- -i test test/MALLPStrict.agda > agda2forth.log 2>&1; then
            cat agda2forth.log
            exit 1
          fi
          cat agda2forth.log
          test -s MALLPStrict.fth
          test -s MALLPEmittedRenderer.agda

      - name: Verify compiler-to-proof synchronization
        id: proof_sync
        if: steps.forth_emit.outcome == 'success'
        run: |
          # Keep the aggregate user rewrite system active and confluence-checked.
          grep -Fq -- '--confluence-check' formal/MALLPForth.agda
          for rule in μ-step-true μ-step-false sBR-stop sBR-step quotient-raw-sound; do
            grep -Fq "$rule" formal/MALLPForth.agda || {
              echo "missing registered rewrite rule: $rule"
              exit 1
            }
          done
          for witness in leastSearch-zero-computes leastSearch-successor-computes symmetricBarRec-stop-computes symmetricBarRec-step-then-stop-computes; do
            grep -Fq "$witness" formal/MALLPForth.agda || {
              echo "missing executable rewrite witness: $witness"
              exit 1
            }
          done
          # Every admitted unary and direct-binary Nat fixture must have a
          # source-semantic theorem in the generated Agda module.
          for source in answerIdentity answerAddFive answerMonusFive answerFiveMonus answerMultiplyFive; do
            grep -Fq "MALLPStrict.$source argument ≡ evalNatLinearExpr" MALLPEmittedRenderer.agda || {
              echo "missing unary Nat source certificate: $source"
              exit 1
            }
          done
          for source in answerAddTwo answerMonusTwo answerReverseMonusTwo answerMultiplyTwo; do
            grep -Fq "MALLPStrict.$source first second ≡ evalNatBinaryLinearExpr" MALLPEmittedRenderer.agda || {
              echo "missing binary Nat source certificate: $source"
              exit 1
            }
          done
          test "$(grep -cE '^sourceNatSemantics[0-9]+ :' MALLPEmittedRenderer.agda)" -eq 5
          test "$(grep -cE '^natLinearCompiledExecution[0-9]+ :' MALLPEmittedRenderer.agda)" -eq 5
          test "$(grep -cE '^sourceNatBinarySemantics[0-9]+ :' MALLPEmittedRenderer.agda)" -eq 4
          test "$(grep -cE '^natBinaryCompiledExecution[0-9]+ :' MALLPEmittedRenderer.agda)" -eq 4
          # Every compiled Nat definition must carry an Agda-checked resource
          # expression, MALLP derivation, and source-semantics theorem.
          for source in answerAdd answerMonus answerMultiply answerLet answerLetShared answerLetUnused answerIdentity answerAddFive answerMonusFive answerFiveMonus answerMultiplyFive answerAddTwo answerMonusTwo answerReverseMonusTwo answerMultiplyTwo answerThree answerThreeLet answerFour answerCallThree answerCallNested; do
            grep -Fq "MALLPStrict.$source" MALLPEmittedRenderer.agda || {
              echo "missing generic Nat resource certificate: $source"
              exit 1
            }
          done
          for certificate in natResourceExpression natResourceDerivation sourceNatResourceSemantics; do
            test "$(grep -cE "^$certificate[0-9]+ :" MALLPEmittedRenderer.agda)" -eq 20 || {
              echo "expected 20 generic Nat resource certificates: $certificate"
              exit 1
            }
          done
          # The exact Haskell token stream must execute in Agda's Forth model,
          # and its result must equal the compiled Agda source function.
          for certificate in natResourceCompilerTokens natResourceCompilerExecution natResourceSourceSound; do
            test "$(grep -cE "^$certificate[0-9]+ :" MALLPEmittedRenderer.agda)" -eq 20 || {
              echo "expected 20 end-to-end Nat compiler certificates: $certificate"
              exit 1
            }
          done
          # A successful bounded-cell execution must return exactly the
          # source result. Overflow remains an explicit target failure.
          test "$(grep -cE '^natResourceBoundedSourceSound[0-9]+ :' MALLPEmittedRenderer.agda)" -eq 20
          for witness in boundedAddAtLimit boundedAddOverflow boundedMonusUnderflow boundedMultiplyOverflow boundedLiteralOverflow; do
            grep -Fq "$witness" formal/MALLPForth.agda || {
              echo "missing bounded Forth semantics witness: $witness"
              exit 1
            }
          done
          # Every emitted source definition must have one renderer equality.
          # A changed compiler output set requires an explicit coverage review.
          test "$(grep -cE '^actualWord[0-9]+ : String' MALLPEmittedRenderer.agda)" -eq 29
          test "$(grep -cE '^wordRendererCorrect[0-9]+ :' MALLPEmittedRenderer.agda)" -eq 29
          grep -Fq 'chooseBoolTokenCorrespondence = refl' MALLPEmittedRenderer.agda
          grep -Fq 'swapBoolPairTokenCorrespondence = refl' MALLPEmittedRenderer.agda
          cat MALLPEmittedRenderer.agda
          if "$AGDA_BIN" --no-prop --no-erasure -i formal -i . -i test MALLPEmittedRenderer.agda > renderer-certificate.log 2>&1; then
            cat renderer-certificate.log
          else
            status=$?
            cat renderer-certificate.log
            echo "Agda renderer certificate exit: $status"
            exit "$status"
          fi

      - name: Execute strict MALLP fixture under Gforth
        id: strict_fixture
        if: steps.proof_sync.outcome == 'success'
        run: |
          trap 'rm -f test/MALLPStrict.agda' EXIT
          echo "Generated Forth module:"
          cat MALLPStrict.fth
          grep -Fq 'MALLP-NAT-ADD' MALLPStrict.fth
          grep -Fq 'MALLP-PARSE-NAT' MALLPStrict.fth
          grep -Fq ': answerTrue TRUE ;' MALLPStrict.fth
          grep -Fq ': answerFalse FALSE ;' MALLPStrict.fth
          grep -Fq ': answerMatchedTrue FALSE ;' MALLPStrict.fth
          grep -Fq ': answerMatchedFalse TRUE ;' MALLPStrict.fth
          grep -Fq ': invertBool IF FALSE ELSE TRUE THEN ;' MALLPStrict.fth
          grep -Fq ': swapBoolPair SWAP ;' MALLPStrict.fth
          grep -Fq ': answerUnit ;' MALLPStrict.fth
          grep -Eq '^: answerIdentity[[:space:]]*;' MALLPStrict.fth
          # Pin the complete 29-definition source fixture. Any addition,
          # removal, or substitution requires a deliberate proof review.
          for word in answerAdd answerMonus answerMultiply answerLet answerLetShared answerLetUnused answerTrue answerFalse invertBool chooseBool swapBoolPair answerMatchedTrue answerMatchedFalse answerUnit answerIdentity answerAddFive answerMonusFive answerFiveMonus answerMultiplyFive answerWord64Identity answerAddTwo answerMonusTwo answerReverseMonusTwo answerMultiplyTwo answerThree answerThreeLet answerFour answerCallThree answerCallNested; do
            grep -Eq "^: ${word}[[:space:]]" MALLPStrict.fth || {
              echo "compiler output manifest mismatch: $word"
              exit 1
            }
          done
          emitted_definitions="$(awk '/^\[then\]$/ { emitted = 1; next } emitted && /^: [[:alnum:]_]+[[:space:]]/ { count++ } END { print count + 0 }' MALLPStrict.fth)"
          echo "Compiler-emitted definitions: $emitted_definitions"
          test "$emitted_definitions" -eq 29 || {
            echo "expected 29 compiler-emitted definitions after FLib.fth [then]"
            exit 1
          }
          grep -Fq 'answerAddFive' MALLPStrict.fth
          grep -Fq 'answerMonusFive' MALLPStrict.fth
          grep -Fq 'answerFiveMonus' MALLPStrict.fth
          grep -Fq 'answerMultiplyFive' MALLPStrict.fth
          grep -Fq 'answerAddTwo' MALLPStrict.fth
          grep -Fq 'answerMonusTwo' MALLPStrict.fth
          grep -Fq 'answerReverseMonusTwo' MALLPStrict.fth
          grep -Fq 'answerMultiplyTwo' MALLPStrict.fth
          grep -Fq 'answerThree' MALLPStrict.fth
          grep -Fq 'answerThreeLet' MALLPStrict.fth
          grep -Fq 'answerFour' MALLPStrict.fth
          grep -Fq 'answerCallThree' MALLPStrict.fth
          grep -Fq 'answerCallNested' MALLPStrict.fth
          grep -Fq 'ROLL' MALLPStrict.fth
          grep -Fq 'SWAP' MALLPStrict.fth
          if grep -Eq '^: answerInt ' MALLPStrict.fth; then
            echo "non-admitted Int definition escaped the result-type gate"
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])(:noname|makeTHUNK|dethunk|foldThunks|pass|HERE|ALLOT|CREATE)([[:space:]]|$)' MALLPStrict.fth; then
            echo "generated strict MALLP code contains a legacy runtime dependency"
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])(DUP|[?]DUP|2DUP|3DUP|OVER|2OVER|PICK|DROP|2DROP|3DROP|NIP|2NIP|TUCK)([[:space:]]|$)' data/FLib.fth MALLPStrict.fth test/gforth/mallp-strict.fs; then
            echo "strict MALLP runtime/output contains a structural duplicate or discard word"
            exit 1
          fi
          grep -n 'answerCall' MALLPStrict.fth || true
          cat test/gforth/mallp-strict.fs >> MALLPStrict.fth
          echo "Running Gforth fixture..."
          if ! gforth MALLPStrict.fth > mallp-strict.log 2>&1; then
            cat mallp-strict.log
            exit 1
          fi
          if ! grep -Fq 'mallp-strict-tests-passed' mallp-strict.log; then
            echo "Gforth exited without the strict fixture completion marker"
            cat mallp-strict.log
            exit 1
          fi
          cat mallp-strict.log

      - name: Require every proof, backend, and execution gate
        if: always()
        env:
          MALLP_CHECK: ${{ steps.mallp_proof.outcome }}
          PHYSICS_CHECK: ${{ steps.physics_proof.outcome }}
          BACKEND_CHECK: ${{ steps.forth_backend.outcome }}
          EMIT_CHECK: ${{ steps.forth_emit.outcome }}
          PROOF_SYNC_CHECK: ${{ steps.proof_sync.outcome }}
          FIXTURE_CHECK: ${{ steps.strict_fixture.outcome }}
        run: |
          printf 'MALLP + Forth renderer: %s\\nPhysics proof: %s\\nBackend build: %s\\nForth emission: %s\\nProof sync: %s\\nGforth fixture: %s\\n' "$MALLP_CHECK" "$PHYSICS_CHECK" "$BACKEND_CHECK" "$EMIT_CHECK" "$PROOF_SYNC_CHECK" "$FIXTURE_CHECK"
          test "$MALLP_CHECK" = success
          test "$PHYSICS_CHECK" = success
          test "$BACKEND_CHECK" = success
          test "$EMIT_CHECK" = success
          test "$PROOF_SYNC_CHECK" = success
          test "$FIXTURE_CHECK" = success
