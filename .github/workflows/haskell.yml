name: build
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: agda2forth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: agda2forth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify per-file upstream source identity
        env:
          SCHEME_UPSTREAM_SHA: 24e02d9669f17d98ec67b8ad961cf9c3e602bf10
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FLIB_EXPECTED_BLOB: 6d7e38dbc2c4e886ac224260558152a418c8c683
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          # Every tracked Haskell source except ToForth.hs must exist in
          # Agda2Scheme at the pinned revision and have the exact same blob.
          while IFS= read -r path; do
            test "$path" = "src/Agda/Compiler/ToForth.hs" && continue
            git cat-file -e "$SCHEME_UPSTREAM_SHA:$path"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SCHEME_UPSTREAM_SHA:$path")"
          done < <(git ls-tree -r --name-only HEAD | grep -E "\\.hs$")

          test "$(git ls-files "*.hs" | grep -v "^src/Agda/Compiler/ToForth.hs$" | wc -l | tr -d " ")" -ge 1
          test "$(git ls-files '*.agda' | wc -l | tr -d ' ')" = 2
          test "$(git ls-files '*.agda')" = "$(printf '%s\n' formal/LinearModalSafety.agda formal/SovereignRationalSEDPhysics.agda)"

          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          # Keep runtime source pinned; Haskell path changes are constrained by the allowlist above.
          test "$(git hash-object data/FLib.fth)" = "$FLIB_EXPECTED_BLOB"

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.0.2'
          cabal-version: '3.10.3.0'
          cabal-update: true

      - name: Configure the build
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal build --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v3
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # Use the official self-contained Agda 2.8.0.2 Linux binary.
      # Verify the release asset digest before placing it on PATH.
      - name: Install Agda CLI for formal checks
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/agda"
          curl --fail --location --retry 3 \
            https://github.com/agda/agda/releases/download/v2.8.0.2/Agda-v2.8.0.2-linux.tar.xz \
            --output "$RUNNER_TEMP/Agda-v2.8.0.2-linux.tar.xz"
          echo "2bcf24bb561b1be859bba841e5d67962d1616b3251bc147f878e4f60a2fbd9f7  $RUNNER_TEMP/Agda-v2.8.0.2-linux.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/Agda-v2.8.0.2-linux.tar.xz" -C "$RUNNER_TEMP/agda"
          agda_binary="$(find "$RUNNER_TEMP/agda" -type f -name agda -perm -u+x -print -quit)"
          test -n "$agda_binary"
          install "$agda_binary" "$HOME/.local/bin/agda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda" --version

      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v3
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all

      - name: Set up GForth
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth

      - name: Check runtime ABI boundaries
        run: gforth -e 'include data/FLib.fth' -e 'include test/gforth/abi-smoke.fs'

      - name: Type-check the unified constructive compiler/runtime specification
        run: |
          "$HOME/.local/bin/agda" --erasure -i formal formal/LinearModalSafety.agda

      # Agda 2.9 adds --cubical=no-glue. Keep the compiler proof pinned to
      # Agda 2.8.0.2 while checking the independent safe physics module with
      # the 2.9.0 release candidate that provides this option.
      - name: Install Agda 2.9.0-rc3 for safe physics check
        run: |
          mkdir -p "$RUNNER_TEMP/agda29"
          curl --fail --location --retry 3 \
            https://github.com/agda/agda/releases/download/v2.9.0-rc3/Agda-v2.9.0-rc3-linux.tar.xz \
            --output "$RUNNER_TEMP/Agda-v2.9.0-rc3-linux.tar.xz"
          echo "bde55ce6855fec13404e6837655b7a98d5174ae82e31525e17fc641dac742cc2  $RUNNER_TEMP/Agda-v2.9.0-rc3-linux.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/Agda-v2.9.0-rc3-linux.tar.xz" -C "$RUNNER_TEMP/agda29"
          agda_binary="$(find "$RUNNER_TEMP/agda29" -type f -name agda -perm -u+x -print -quit)"
          test -n "$agda_binary"
          install "$agda_binary" "$HOME/.local/bin/agda-2.9"
          "$HOME/.local/bin/agda-2.9" --version

      - name: Type-check safe RSED physics without Glue
        run: |
          "$HOME/.local/bin/agda-2.9" -i formal formal/SovereignRationalSEDPhysics.agda

      - name: Verify oversized Nat literals fail through the bounded runtime parser
        run: |
          cp test/UnsupportedNatLiteral.agda.src test/UnsupportedNatLiteral.agda
          trap 'rm -f test/UnsupportedNatLiteral.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/UnsupportedNatLiteral.agda
          grep -Fq 'ABI-PARSE-NAT' UnsupportedNatLiteral.fth
          if grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedNatLiteral.fth; then
            echo "oversized Nat output must throw, not terminate Gforth with BYE"
            exit 1
          fi
          gforth UnsupportedNatLiteral.fth test/gforth/unsupported-nat-literal.fs > unsupported-nat-literal.log
          grep -Fq 'oversized-nat-literal-tests-passed' unsupported-nat-literal.log

      - name: Verify unsupported string literals fail through the catchable runtime boundary
        run: |
          cp test/UnsupportedLiteral.agda.src test/UnsupportedLiteral.agda
          trap 'rm -f test/UnsupportedLiteral.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/UnsupportedLiteral.agda
          grep -Fq 'not yet supported: String literals " ABI-ERROR-COMPILED-UNSUPPORTED' UnsupportedLiteral.fth
          if grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedLiteral.fth; then
            echo "unsupported output must throw, not terminate Gforth with BYE"
            exit 1
          fi
          gforth UnsupportedLiteral.fth test/gforth/unsupported-boundary.fs > unsupported-boundary.log
          grep -Fq 'unsupported-boundary-tests-passed' unsupported-boundary.log
          grep -Fq 'not yet supported: String literals' unsupported-boundary.log

      - name: Verify unsupported axioms fail through the catchable runtime boundary
        run: |
          cp test/UnsupportedAxiom.agda.src test/UnsupportedAxiom.agda
          trap 'rm -f test/UnsupportedAxiom.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/UnsupportedAxiom.agda
          grep -Fq 'encountered axiom: unknownNat' UnsupportedAxiom.fth
          if grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedAxiom.fth; then
            echo "unsupported axiom output must throw, not terminate Gforth with BYE"
            exit 1
          fi
          gforth UnsupportedAxiom.fth test/gforth/unsupported-axiom-boundary.fs > unsupported-axiom-boundary.log
          grep -Fq 'unsupported-axiom-tests-passed' unsupported-axiom-boundary.log
          grep -Fq 'encountered axiom: unknownNat' unsupported-axiom-boundary.log

      - name: Compile and execute supported primitive applications end to end
        run: |
          cp test/CheckedScalar.agda.src test/CheckedScalar.agda
          trap 'rm -f test/CheckedScalar.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/CheckedScalar.agda
          grep -Eq 's" [0-9]+[[:space:]]*" ABI-PARSE-NAT' CheckedScalar.fth
          echo "---- emitted CheckedScalar.fth ----"
          cat CheckedScalar.fth
          echo "---- generated primitive execution ----"
          gforth CheckedScalar.fth test/gforth/compiler-integration.fs

      - name: Compile and execute the formal core's finite-observation/dyad slice
        run: |
          cp test/VerifiedCoreSmoke.agda.src test/VerifiedCoreSmoke.agda
          trap 'rm -f test/VerifiedCoreSmoke.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/VerifiedCoreSmoke.agda
          grep -n -E 'finiteObservation|coreCoNatAtZero|coreCoNatStopsAtOne|coreInfinityAtDepthEight|corePow2Zero|corePow2One' VerifiedCoreSmoke.fth || true
          gforth VerifiedCoreSmoke.fth test/gforth/verified-core-smoke.fs > verified-core-smoke.log || { cat verified-core-smoke.log; exit 1; }
          grep -Fq 'verified-core-runtime-tests-passed' verified-core-smoke.log || { cat verified-core-smoke.log; exit 1; }

      - name: Compile first-order triples fixture
        run: |
          cp test/TriplesFO.agda.src test/TriplesFO.agda
          trap 'rm -f test/TriplesFO.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/TriplesFO.agda

      - name: Compile and execute allocation-free strict MALLP Nat fragment
        run: |
          cp test/MALLPStrict.agda.src test/MALLPStrict.agda
          trap 'rm -f test/MALLPStrict.agda' EXIT
          cabal run agda2forth -- --strict-mallp --erasure -i test test/MALLPStrict.agda
          grep -Fq 'MALLP-NAT-ADD' MALLPStrict.fth
          grep -Fq 'MALLP-PARSE-NAT' MALLPStrict.fth
          if grep -Eiq '(:noname|makeTHUNK|foldThunks|passMany|deepdethunk|ABI-|HERE|ALLOT|MODE-|THUNK|RESULT)' MALLPStrict.fth; then
            echo "strict MALLP output must not depend on descriptor/thunk ABI"
            exit 1
          fi
          gforth MALLPStrict.fth test/gforth/mallp-strict.fs > mallp-strict.log
          grep -Fq 'mallp-strict-tests-passed' mallp-strict.log
