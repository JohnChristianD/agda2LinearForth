name: build
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: agda2mallpforth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: strict-mallp-gforth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository shape and upstream provenance
        env:
          SCHEME_UPSTREAM_SHA: 24e02d9669f17d98ec67b8ad961cf9c3e602bf10
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FLIB_UPSTREAM_BLOB: e27c965767845678ac1b157b5fcffebe910fbfe4
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          while IFS= read -r path; do
            case "$path" in
              src/Agda/Compiler/ToForth.hs|src/Agda/Compiler/NatCore.hs|test/NatCore.hs) continue ;;
            esac
            git cat-file -e "$SCHEME_UPSTREAM_SHA:$path"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SCHEME_UPSTREAM_SHA:$path")"
          done < <(git ls-tree -r --name-only HEAD | grep -E "\\.hs$")
          test "$(git ls-files '*.hs' | grep -v '^src/Agda/Compiler/ToForth.hs$' | wc -l | tr -d ' ')" -ge 1
          test "$(git ls-files '*.agda' | paste -sd ' ')" = "formal/MALLPForth.agda formal/SovereignRationalSEDPhysics.agda"
          expected_markdown_files="$(printf '%s\n' '.scratch/wayfinder/verified-agda-forth/MAP.md' 'README.md' | LC_ALL=C sort)"
          actual_markdown_files="$(git ls-files '*.md' | LC_ALL=C sort)"
          test "$actual_markdown_files" = "$expected_markdown_files"
          test -z "$(git ls-files '*.sh' '*.bash' '*.ps1')"
          test -f cabal.project
          grep -Fq 'tag: v2.8.0.2' cabal.project
          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse "$FORTH_UPSTREAM_SHA:data/FLib.fth")" = "$FLIB_UPSTREAM_BLOB"
          grep -Fq 'MALLP-CHECK-NAT { value -- }' data/FLib.fth

      - name: Install native linker and Gforth
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-gold gforth
          command -v ld
          ld --version
          printf 'int main(void) { return 0; }\n' | gcc -fuse-ld=gold -x c -o "$RUNNER_TEMP/gold-linker-smoke" -

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.10.3.0'
          cabal-update: false

      - name: Restore Cabal and local build caches
        id: build_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', 'agda2forth.cabal') }}-local-build-v2
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-

      - name: Build the stable Agda CLI
        id: agda_cli
        run: |
          cabal update
          cabal build Agda:exe:agda
          agda_bin="$(cabal list-bin Agda:exe:agda)"
          test -x "$agda_bin"
          test "$("$agda_bin" --numeric-version)" = "2.8.0.2"
          echo "AGDA_BIN=$agda_bin" >> "$GITHUB_ENV"

      # Save before proof/test gates: their failures must not discard this expensive build.
      - name: Save Cabal and local build caches
        if: always() && steps.agda_cli.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', 'agda2forth.cabal') }}-local-build-v2

      - name: Type-check the MALLP specification and rewrite system
        id: mallp_proof
        continue-on-error: true
        run: |
          "$AGDA_BIN" -i formal formal/MALLPForth.agda

      - name: Type-check the separate RSED physics specification
        id: physics_proof
        continue-on-error: true
        run: |
          "$AGDA_BIN" -i formal formal/SovereignRationalSEDPhysics.agda

      - name: Build the Haskell Forth backend
        id: forth_backend
        continue-on-error: true
        run: |
          cabal build agda2forth

      - name: Compile and execute the strict MALLP fixture
        id: strict_fixture
        if: steps.forth_backend.outcome == 'success'
        run: |
          cp test/MALLPStrict.agda.src test/MALLPStrict.agda
          trap 'rm -f test/MALLPStrict.agda' EXIT
          cabal run agda2forth -- -i test test/MALLPStrict.agda
          grep -Fq 'MALLP-NAT-ADD' MALLPStrict.fth
          grep -Fq 'MALLP-PARSE-NAT' MALLPStrict.fth
          if grep -Eq '(^|[[:space:]])(:noname|makeTHUNK|dethunk|foldThunks|pass|HERE|ALLOT|CREATE)([[:space:]]|$)' MALLPStrict.fth; then
            echo "generated strict MALLP code contains a legacy runtime dependency"
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])(DUP|[?]DUP|2DUP|3DUP|OVER|2OVER|PICK|DROP|2DROP|3DROP|NIP|2NIP|TUCK)([[:space:]]|$)' data/FLib.fth MALLPStrict.fth test/gforth/mallp-strict.fs; then
            echo "strict MALLP runtime/output contains a structural duplicate or discard word"
            exit 1
          fi
          gforth MALLPStrict.fth test/gforth/mallp-strict.fs > mallp-strict.log
          grep -Fq 'mallp-strict-tests-passed' mallp-strict.log

      - name: Require every proof, backend, and execution gate
        if: always()
        env:
          MALLP_CHECK: ${{ steps.mallp_proof.outcome }}
          PHYSICS_CHECK: ${{ steps.physics_proof.outcome }}
          BACKEND_CHECK: ${{ steps.forth_backend.outcome }}
          FIXTURE_CHECK: ${{ steps.strict_fixture.outcome }}
        run: |
          printf 'MALLP proof: %s\nPhysics proof: %s\nBackend build: %s\nGforth fixture: %s\n' "$MALLP_CHECK" "$PHYSICS_CHECK" "$BACKEND_CHECK" "$FIXTURE_CHECK"
          test "$MALLP_CHECK" = success
          test "$PHYSICS_CHECK" = success
          test "$BACKEND_CHECK" = success
          test "$FIXTURE_CHECK" = success
