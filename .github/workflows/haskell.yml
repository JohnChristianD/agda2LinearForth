name: build
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: agda2mallpforth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: strict-mallp-gforth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository shape and upstream provenance
        env:
          SCHEME_UPSTREAM_SHA: 24e02d9669f17d98ec67b8ad961cf9c3e602bf10
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FLIB_EXPECTED_BLOB: de46e5614f6de224458b3b96e18e81ad42502987
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          while IFS= read -r path; do
            test "$path" = "src/Agda/Compiler/ToForth.hs" && continue
            git cat-file -e "$SCHEME_UPSTREAM_SHA:$path"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SCHEME_UPSTREAM_SHA:$path")"
          done < <(git ls-tree -r --name-only HEAD | grep -E "\\.hs$")
          test "$(git ls-files '*.hs' | grep -v '^src/Agda/Compiler/ToForth.hs$' | wc -l | tr -d ' ')" -ge 1
          test "$(git ls-files '*.agda' | paste -sd ' ')" = "formal/LinearModalSafety.agda formal/SovereignRationalSEDPhysics.agda"
          test "$(git ls-files '*.md')" = "README.md"
          test -z "$(git ls-files '*.sh' '*.bash' '*.ps1')"
          test -f cabal.project
          grep -Fq 'tag: v2.9.0-rc3' cabal.project
          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          test "$(git hash-object data/FLib.fth)" = "$FLIB_EXPECTED_BLOB"

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.10.3.0'
          cabal-update: true

      - name: Install the single pinned Agda version
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/agda"
          curl --fail --location --retry 3 \\
            https://github.com/agda/agda/releases/download/v2.9.0-rc3/Agda-v2.9.0-rc3-linux.tar.xz \\
            --output "$RUNNER_TEMP/Agda-v2.9.0-rc3-linux.tar.xz"
          echo "bde55ce6855fec13404e6837655b7a98d5174ae82e31525e17fc641dac742cc2  $RUNNER_TEMP/Agda-v2.9.0-rc3-linux.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/Agda-v2.9.0-rc3-linux.tar.xz" -C "$RUNNER_TEMP/agda"
          agda_binary="$(find "$RUNNER_TEMP/agda" -type f -name agda -perm -u+x -print -quit)"
          test -n "$agda_binary"
          install "$agda_binary" "$HOME/.local/bin/agda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          agda --version

      - name: Build Haskell backend
        run: |
          cabal configure --disable-documentation
          cabal build all

      - name: Install GNU Gforth
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth

      - name: Type-check both safe Agda specifications with the same compiler
        run: |
          agda -i formal formal/LinearModalSafety.agda
          agda -i formal formal/SovereignRationalSEDPhysics.agda

      - name: Compile and execute the strict MALLP fixture
        run: |
          cp test/MALLPStrict.agda.src test/MALLPStrict.agda
          trap 'rm -f test/MALLPStrict.agda' EXIT
          cabal run agda2forth -- --erasure -i test test/MALLPStrict.agda
          grep -Fq 'MALLP-NAT-ADD' MALLPStrict.fth
          grep -Fq 'MALLP-PARSE-NAT' MALLPStrict.fth
          if grep -Eq '(^|[[:space:]])(:noname|makeTHUNK|dethunk|foldThunks|pass|HERE|ALLOT|CREATE)([[:space:]]|$)' MALLPStrict.fth; then
            echo "generated strict MALLP code contains a legacy runtime dependency"
            exit 1
          fi
          gforth MALLPStrict.fth test/gforth/mallp-strict.fs > mallp-strict.log
          grep -Fq 'mallp-strict-tests-passed' mallp-strict.log
