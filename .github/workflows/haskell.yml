name: build
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: agda2mallpforth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: strict-mallp-gforth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository shape and upstream provenance
        env:
          SCHEME_UPSTREAM_SHA: 24e02d9669f17d98ec67b8ad961cf9c3e602bf10
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FLIB_UPSTREAM_BLOB: e27c965767845678ac1b157b5fcffebe910fbfe4
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          while IFS= read -r path; do
            test "$path" = "src/Agda/Compiler/ToForth.hs" && continue
            git cat-file -e "$SCHEME_UPSTREAM_SHA:$path"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SCHEME_UPSTREAM_SHA:$path")"
          done < <(git ls-tree -r --name-only HEAD | grep -E "\\.hs$")
          test "$(git ls-files '*.hs' | grep -v '^src/Agda/Compiler/ToForth.hs$' | wc -l | tr -d ' ')" -ge 1
          test "$(git ls-files '*.agda' | paste -sd ' ')" = "formal/MALLPForth.agda formal/SovereignRationalSEDPhysics.agda"
          expected_markdown_files="README.md"
          actual_markdown_files="$(git ls-files '*.md' | LC_ALL=C sort)"
          test "$actual_markdown_files" = "$expected_markdown_files"
          test -z "$(git ls-files '*.sh' '*.bash' '*.ps1')"
          test -f cabal.project
          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse "$FORTH_UPSTREAM_SHA:data/FLib.fth")" = "$FLIB_UPSTREAM_BLOB"
          grep -Fq 'MALLP-CHECK-NAT { value -- }' data/FLib.fth

      - name: Install native linker and Gforth
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-gold gforth
          command -v ld
          ld --version
          printf 'int main(void) { return 0; }\n' | gcc -fuse-ld=gold -x c -o "$RUNNER_TEMP/gold-linker-smoke" -

      - name: Materialize transient strict regression fixtures
        run: |
          mkdir -p test/gforth
          cat > test/MALLPStrict.agda.src <<'AGDA'
          module MALLPStrict where
          
          open import Agda.Builtin.Nat using (Nat; _+_; _*_; _-_)
          
          answerAdd : Nat
          answerAdd = 7 + 13
          answerMonus : Nat
          answerMonus = 2 - 5
          answerMultiply : Nat
          answerMultiply = (2 + 3) * 4
          answerLet : Nat
          answerLet = let value = 7 + 13 in value * 2
          answerLetShared : Nat
          answerLetShared = let value = 10 + 3 in value * value
          answerLetUnused : Nat
          answerLetUnused = let ignored = 1000 * 1000 in 7
          
          open import Agda.Builtin.Bool using (Bool; true; false)
          answerTrue : Bool
          answerTrue = true
          answerFalse : Bool
          answerFalse = false
          invertBool : Bool → Bool
          invertBool true = false
          invertBool false = true
          chooseBool : Bool → Bool → Bool
          chooseBool true value = value
          chooseBool false value = value
          data BoolPair : Set where
            boolPair : Bool → Bool → BoolPair
          swapBoolPair : BoolPair → BoolPair
          swapBoolPair (boolPair first second) = boolPair second first
          answerMatchedTrue : Bool
          answerMatchedTrue = invertBool true
          answerMatchedFalse : Bool
          answerMatchedFalse = invertBool false
          
          open import Agda.Builtin.Unit using (⊤; tt)
          answerUnit : ⊤
          answerUnit = tt
          answerUnitDropsNat : Nat → ⊤
          answerUnitDropsNat value = tt
          answerIdentity : Nat → Nat
          answerIdentity value = value
          answerAddFive : Nat → Nat
          answerAddFive value = value + 5
          answerMonusFive : Nat → Nat
          answerMonusFive value = value - 5
          answerFiveMonus : Nat → Nat
          answerFiveMonus value = 5 - value
          answerMultiplyFive : Nat → Nat
          answerMultiplyFive value = value * 5
          
          open import Agda.Builtin.Int using (Int; pos)
          open import Agda.Builtin.Word using (Word64)
          answerWord64Identity : Word64 → Word64
          answerWord64Identity value = value
          answerInt : Int
          answerInt = pos 2
          answerAddTwo : Nat → Nat → Nat
          answerAddTwo x y = x + y
          answerMonusTwo : Nat → Nat → Nat
          answerMonusTwo x y = x - y
          answerReverseMonusTwo : Nat → Nat → Nat
          answerReverseMonusTwo x y = y - x
          answerMultiplyTwo : Nat → Nat → Nat
          answerMultiplyTwo x y = x * y
          answerThree : Nat → Nat → Nat → Nat
          answerThree x y z = (x + z) * y
          answerThreeLet : Nat → Nat → Nat → Nat
          answerThreeLet x y z =
            let partial = x + z in partial * y
          answerFour : Nat → Nat → Nat → Nat → Nat
          answerFour w x y z = (w + y) * (x + z)
          answerCallThree : Nat → Nat → Nat → Nat
          answerCallThree x y z = answerAddTwo x (y + z)
          answerCallNested : Nat → Nat → Nat → Nat
          answerCallNested x y z = answerMultiplyTwo (x + z) y
          AGDA
          cat > test/gforth/mallp-strict.fs <<'FORTH'
          : strict-assert-boolean { actual expected -- }
            actual expected <> IF
              ." strict MALLP boolean mismatch" cr
              -4202 THROW
            THEN
          ;
          : strict-assert-bool-pair { actual-bottom actual-top expected-bottom expected-top -- }
            actual-bottom expected-bottom <> IF
              ." strict MALLP pair bottom mismatch" cr
              -4204 THROW
            THEN
            actual-top expected-top <> IF
              ." strict MALLP pair top mismatch" cr
              -4205 THROW
            THEN
          ;
          : strict-assert-word64 { actual-high actual-low expected-high expected-low -- }
            actual-high expected-high <> IF
              ." strict MALLP Word64 high limb mismatch" cr
              -4206 THROW
            THEN
            actual-low expected-low <> IF
              ." strict MALLP Word64 low limb mismatch" cr
              -4207 THROW
            THEN
          ;
          : strict-assert-natural { actual expected -- }
            actual expected <> IF
              ." strict MALLP natural mismatch" cr
              -4201 THROW
            THEN
          ;
          answerAdd 20 strict-assert-natural
          answerMonus 0 strict-assert-natural
          answerMultiply 20 strict-assert-natural
          answerLet 40 strict-assert-natural
          answerLetShared 169 strict-assert-natural
          answerLetUnused 7 strict-assert-natural
          answerTrue TRUE strict-assert-boolean
          answerFalse FALSE strict-assert-boolean
          answerMatchedTrue FALSE strict-assert-boolean
          answerMatchedFalse TRUE strict-assert-boolean
          TRUE invertBool FALSE strict-assert-boolean
          FALSE invertBool TRUE strict-assert-boolean
          TRUE FALSE chooseBool FALSE strict-assert-boolean
          FALSE TRUE chooseBool TRUE strict-assert-boolean
          TRUE FALSE swapBoolPair FALSE TRUE strict-assert-bool-pair
          answerUnit
          10 answerIdentity 10 strict-assert-natural
          10 answerAddFive 15 strict-assert-natural
          3 answerMonusFive 0 strict-assert-natural
          3 answerFiveMonus 2 strict-assert-natural
          4 answerMultiplyFive 20 strict-assert-natural
          7 13 answerAddTwo 20 strict-assert-natural
          2 5 answerMonusTwo 0 strict-assert-natural
          5 2 answerMonusTwo 3 strict-assert-natural
          2 5 answerReverseMonusTwo 3 strict-assert-natural
          4 5 answerMultiplyTwo 20 strict-assert-natural
          4294967295 4294967295 answerWord64Identity
          4294967295 4294967295 strict-assert-word64
          2 3 4 answerThree 18 strict-assert-natural
          2 3 4 answerThreeLet 18 strict-assert-natural
          2 3 4 5 answerFour 48 strict-assert-natural
          2 3 4 answerCallThree 9 strict-assert-natural
          2 3 4 answerCallNested 18 strict-assert-natural
          : testStrictOverflow ( -- )
            MALLP-MAX-NAT 1 MALLP-NAT-ADD { ignored }
          ;
          ' testStrictOverflow CATCH MALLP-ERR-OVERFLOW strict-assert-natural
          : testStrictNegative ( -- )
            -1 MALLP-CHECK-NAT
          ;
          ' testStrictNegative CATCH MALLP-ERR-NEGATIVE strict-assert-natural
          MALLP-MAX-NAT 0 MALLP-NAT-ADD MALLP-MAX-NAT strict-assert-natural
          : testStrictMultiplyOverflow ( -- )
            MALLP-MAX-NAT 2 MALLP-NAT-MUL { ignored }
          ;
          ' testStrictMultiplyOverflow CATCH MALLP-ERR-OVERFLOW strict-assert-natural
          : testStrictParseMax ( -- )
            MALLP-MAX-NAT 0 <# #S #> MALLP-PARSE-NAT
            MALLP-MAX-NAT strict-assert-natural
          ;
          testStrictParseMax
          s" 000123" MALLP-PARSE-NAT 123 strict-assert-natural
          : testStrictLiteralEmpty ( -- )
            s" " MALLP-PARSE-NAT { ignored }
          ;
          ' testStrictLiteralEmpty CATCH MALLP-ERR-LITERAL strict-assert-natural
          : testStrictLiteralInvalid ( -- )
            s" 12x" MALLP-PARSE-NAT { ignored }
          ;
          ' testStrictLiteralInvalid CATCH MALLP-ERR-LITERAL strict-assert-natural
          : testStrictLiteralNegative ( -- )
            s" -1" MALLP-PARSE-NAT { ignored }
          ;
          ' testStrictLiteralNegative CATCH MALLP-ERR-LITERAL strict-assert-natural
          : testStrictLiteralOverflow ( -- )
            s" 999999999999999999999999999999999999999999999999999999999999999999"
              MALLP-PARSE-NAT { ignored }
          ;
          ' testStrictLiteralOverflow CATCH MALLP-ERR-OVERFLOW strict-assert-natural
          : assert-empty-stack ( -- )
            depth 0<> IF -4203 THROW THEN
          ;
          assert-empty-stack
          cr ." mallp-strict-tests-passed" cr
          BYE
          FORTH

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.10.3.0'
          cabal-update: false

      - name: Restore Cabal and local build caches
        id: build_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', 'agda2forth.cabal') }}-local-build-v2
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-

      - name: Install latest stable Agda from Hackage
        id: agda_cli
        run: |
          cabal update
          agda_bin_dir="$RUNNER_TEMP/agda/bin"
          mkdir -p "$agda_bin_dir"
          cabal install Agda --installdir="$agda_bin_dir" --overwrite-policy=always
          agda_bin="$agda_bin_dir/agda"
          test -x "$agda_bin"
          echo "$agda_bin_dir" >> "$GITHUB_PATH"
          echo "AGDA_BIN=$agda_bin" >> "$GITHUB_ENV"

      - name: Save Cabal and local build caches
        if: always() && steps.agda_cli.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', 'agda2forth.cabal') }}-local-build-v2

      # The Forth token algebra and canonical renderer are in MALLPForth.agda.
      - name: Type-check MALLP, rewrite system, and integrated Forth renderer
        id: mallp_proof
        run: |
          "$AGDA_BIN" -i formal formal/MALLPForth.agda

      - name: Type-check the separate RSED physics specification
        id: physics_proof
        run: |
          "$AGDA_BIN" -i formal formal/SovereignRationalSEDPhysics.agda

      - name: Build the Haskell Forth backend
        id: forth_backend
        run: |
          cabal build agda2forth

      - name: Compile strict MALLP source and emit Forth
        id: forth_emit
        run: |
          cp test/MALLPStrict.agda.src test/MALLPStrict.agda
          if ! cabal run agda2forth -- -i test test/MALLPStrict.agda > agda2forth.log 2>&1; then
            cat agda2forth.log
            exit 1
          fi
          cat agda2forth.log
          test -s MALLPStrict.fth
          test -s MALLPEmittedRenderer.agda
          # Type-check the source/resource/Forth certificates just emitted.
          if ! "$AGDA_BIN" --no-prop --no-erasure -i formal -i . -i test MALLPEmittedRenderer.agda > renderer-certificate.log 2>&1; then
            cat renderer-certificate.log
            exit 1
          fi
          cat renderer-certificate.log

      - name: Execute strict MALLP fixture under Gforth
        id: strict_fixture
        run: |
          trap 'rm -f test/MALLPStrict.agda' EXIT
          echo "Generated Forth module:"
          cat MALLPStrict.fth
          grep -Fq 'MALLP-NAT-ADD' MALLPStrict.fth
          grep -Fq 'MALLP-PARSE-NAT' MALLPStrict.fth
          grep -Fq ': answerTrue TRUE ;' MALLPStrict.fth
          grep -Fq ': answerFalse FALSE ;' MALLPStrict.fth
          grep -Fq ': answerMatchedTrue FALSE ;' MALLPStrict.fth
          grep -Fq ': answerMatchedFalse TRUE ;' MALLPStrict.fth
          grep -Fq ': invertBool IF FALSE ELSE TRUE THEN ;' MALLPStrict.fth
          grep -Fq ': swapBoolPair SWAP ;' MALLPStrict.fth
          grep -Fq ': answerUnit ;' MALLPStrict.fth
          grep -Eq '^: answerIdentity[[:space:]]*;' MALLPStrict.fth
          # Pin the complete 29-definition source fixture. Any addition,
          # removal, or substitution requires a deliberate proof review.
          for word in answerAdd answerMonus answerMultiply answerLet answerLetShared answerLetUnused answerTrue answerFalse invertBool chooseBool swapBoolPair answerMatchedTrue answerMatchedFalse answerUnit answerIdentity answerAddFive answerMonusFive answerFiveMonus answerMultiplyFive answerWord64Identity answerAddTwo answerMonusTwo answerReverseMonusTwo answerMultiplyTwo answerThree answerThreeLet answerFour answerCallThree answerCallNested; do
            grep -Eq "^: ${word}[[:space:]]" MALLPStrict.fth || {
              echo "compiler output manifest mismatch: $word"
              exit 1
            }
          done
          emitted_definitions="$(awk '/^\[then\]$/ { emitted = 1; next } emitted && /^: [[:alnum:]_]+[[:space:]]/ { count++ } END { print count + 0 }' MALLPStrict.fth)"
          echo "Compiler-emitted definitions: $emitted_definitions"
          test "$emitted_definitions" -eq 29 || {
            echo "expected 29 compiler-emitted definitions after FLib.fth [then]"
            exit 1
          }
          grep -Fq 'answerAddFive' MALLPStrict.fth
          grep -Fq 'answerMonusFive' MALLPStrict.fth
          grep -Fq 'answerFiveMonus' MALLPStrict.fth
          grep -Fq 'answerMultiplyFive' MALLPStrict.fth
          grep -Fq 'answerAddTwo' MALLPStrict.fth
          grep -Fq 'answerMonusTwo' MALLPStrict.fth
          grep -Fq 'answerReverseMonusTwo' MALLPStrict.fth
          grep -Fq 'answerMultiplyTwo' MALLPStrict.fth
          grep -Fq 'answerThree' MALLPStrict.fth
          grep -Fq 'answerThreeLet' MALLPStrict.fth
          grep -Fq 'answerFour' MALLPStrict.fth
          grep -Fq 'answerCallThree' MALLPStrict.fth
          grep -Fq 'answerCallNested' MALLPStrict.fth
          grep -Fq 'ROLL' MALLPStrict.fth
          grep -Fq 'SWAP' MALLPStrict.fth
          if grep -Eq '^: answerInt ' MALLPStrict.fth; then
            echo "non-admitted Int definition escaped the result-type gate"
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])(:noname|makeTHUNK|dethunk|foldThunks|pass|HERE|ALLOT|CREATE)([[:space:]]|$)' MALLPStrict.fth; then
            echo "generated strict MALLP code contains a legacy runtime dependency"
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])(DUP|[?]DUP|2DUP|3DUP|OVER|2OVER|PICK|DROP|2DROP|3DROP|NIP|2NIP|TUCK)([[:space:]]|$)' data/FLib.fth MALLPStrict.fth test/gforth/mallp-strict.fs; then
            echo "strict MALLP runtime/output contains a structural duplicate or discard word"
            exit 1
          fi
          grep -n 'answerCall' MALLPStrict.fth || true
          cat test/gforth/mallp-strict.fs >> MALLPStrict.fth
          echo "Running Gforth fixture..."
          if ! gforth MALLPStrict.fth > mallp-strict.log 2>&1; then
            cat mallp-strict.log
            exit 1
          fi
          if ! grep -Fq 'mallp-strict-tests-passed' mallp-strict.log; then
            echo "Gforth exited without the strict fixture completion marker"
            cat mallp-strict.log
            exit 1
          fi
          cat mallp-strict.log
