name: build
on: [push, pull_request]

concurrency:
  group: agda2forth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: agda2forth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify per-file upstream source identity
        env:
          SCHEME_UPSTREAM_SHA: 24e02d9669f17d98ec67b8ad961cf9c3e602bf10
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FORTH_MAIN_ADAPTER_BLOB: be738fab5d26f009576e6b1a51237d4f7f2f1f9e
          FLIB_EXPECTED_BLOB: 30477369597107b579ffac29735c42b6e326b0d0
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          git diff --exit-code "$SCHEME_UPSTREAM_SHA" HEAD -- app/Main.hs src/Agda/Compiler/Erase.hs

          # The only Haskell path changes versus Agda2Scheme are the Forth
          # translation module, removal of the Scheme translation module, and
          # the Forth-specific Agda 2.8 driver adapter.
          actual_hs="$(git diff --name-only "$SCHEME_UPSTREAM_SHA" HEAD -- '*.hs' | sort)"
          expected_hs="$(printf '%s\n' \
            src/Agda/Compiler/ToForth.hs \
            src/Agda/Compiler/ToScheme.hs \
            src/Main.hs | sort)"
          test "$actual_hs" = "$expected_hs"

          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          # The Forth driver is a minimal Agda 2.8 API adapter, pinned independently.
          test "$(git hash-object src/Main.hs)" = "$FORTH_MAIN_ADAPTER_BLOB"
          # Shared entrypoint and erasure implementation remain byte-identical to Agda2Scheme.
          git diff --exit-code "$SCHEME_UPSTREAM_SHA" HEAD -- app/Main.hs src/Agda/Compiler/Erase.hs

          # Pin the reviewed runtime implementation while allowing only ToForth.hs among Haskell files.
          test "$(git hash-object data/FLib.fth)" = "$FLIB_EXPECTED_BLOB"

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.0.2'
          cabal-version: '3.10.3.0'
          cabal-update: true

      - name: Configure the build
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal build --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v3
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # Agda 2.8.0.2's setup hook needs the Agda executable while installing
      # interface files. Install the CLI before Cabal builds library-only deps.
      - name: Install Agda CLI for formal checks
        run: |
          mkdir -p "$HOME/.local/bin"
          cabal install Agda-2.8.0.2 --installdir="$HOME/.local/bin" --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda" --version

      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v3
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all

      - name: Set up GForth
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth

      - name: Check runtime ABI boundaries
        run: gforth -e 'include data/FLib.fth' -e 'include test/gforth/abi-smoke.fs'

      - name: Type-check the unified constructive compiler/runtime specification
        run: |
          "$HOME/.local/bin/agda" --erasure -i formal formal/LinearModalSafety.agda

      - name: Verify oversized Nat literals fail through the bounded runtime parser
        run: |
          cabal run agda2forth -- --erasure -i test test/UnsupportedNatLiteral.agda
          grep -Fq 'ABI-PARSE-NAT' UnsupportedNatLiteral.fth
          if grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedNatLiteral.fth; then
            echo "oversized Nat output must throw, not terminate Gforth with BYE"
            exit 1
          fi
          gforth UnsupportedNatLiteral.fth test/gforth/unsupported-nat-literal.fs > unsupported-nat-literal.log
          grep -Fq 'oversized-nat-literal-tests-passed' unsupported-nat-literal.log

      - name: Verify unsupported string literals fail through the catchable runtime boundary
        run: |
          cabal run agda2forth -- --erasure -i test test/UnsupportedLiteral.agda
          grep -Fq 'not yet supported: String literals " ABI-ERROR-COMPILED-UNSUPPORTED' UnsupportedLiteral.fth
          if grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedLiteral.fth; then
            echo "unsupported output must throw, not terminate Gforth with BYE"
            exit 1
          fi
          gforth UnsupportedLiteral.fth test/gforth/unsupported-boundary.fs > unsupported-boundary.log
          grep -Fq 'unsupported-boundary-tests-passed' unsupported-boundary.log
          grep -Fq 'not yet supported: String literals' unsupported-boundary.log

      - name: Verify unsupported axioms fail through the catchable runtime boundary
        run: |
          cabal run agda2forth -- --erasure -i test test/UnsupportedAxiom.agda
          grep -Fq 'encountered axiom: unknownNat' UnsupportedAxiom.fth
          if grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedAxiom.fth; then
            echo "unsupported axiom output must throw, not terminate Gforth with BYE"
            exit 1
          fi
          gforth UnsupportedAxiom.fth test/gforth/unsupported-axiom-boundary.fs > unsupported-axiom-boundary.log
          grep -Fq 'unsupported-axiom-tests-passed' unsupported-axiom-boundary.log
          grep -Fq 'encountered axiom: unknownNat' unsupported-axiom-boundary.log

      - name: Compile and execute supported primitive applications end to end
        run: |
          cabal run agda2forth -- --erasure -i test test/CheckedScalar.agda
          grep -Eq 's" [0-9]+[[:space:]]*" ABI-PARSE-NAT' CheckedScalar.fth
          echo "---- emitted CheckedScalar.fth ----"
          cat CheckedScalar.fth
          echo "---- generated primitive execution ----"
          gforth CheckedScalar.fth test/gforth/compiler-integration.fs

      - name: Compile and execute the formal core's finite-observation/dyad slice
        run: |
          cabal run agda2forth -- --erasure -i formal formal/VerifiedCoreExecutable.agda
          cabal run agda2forth -- --erasure -i formal -i test test/VerifiedCoreSmoke.agda
          grep -n -E 'finiteObservation|coreCoNatAtZero|coreCoNatStopsAtOne|coreInfinityAtDepthEight|corePow2Zero|corePow2One' VerifiedCoreExecutable.fth VerifiedCoreSmoke.fth || true
          gforth VerifiedCoreExecutable.fth VerifiedCoreSmoke.fth test/gforth/verified-core-smoke.fs > verified-core-smoke.log || { cat verified-core-smoke.log; exit 1; }
          grep -Fq 'verified-core-runtime-tests-passed' verified-core-smoke.log || { cat verified-core-smoke.log; exit 1; }

      - name: Compile first-order triples fixture
        run: cabal run agda2forth -- --erasure -i test test/TriplesFO.agda
