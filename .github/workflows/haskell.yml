name: build
on: [push, pull_request]

jobs:
  build:
    name: agda2forth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GForth
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth

      - name: Load runtime and exercise checked handle paths
        run: |
          gforth data/FLib.fth -e ": modal-body drop ; ' modal-body declareModalSafeXT ' modal-body makeTHUNK promoteModal makeRESULT assertModalValue ' modal-body makeTHUNK promoteModal pass promoteModal drop bye"
          gforth data/FLib.fth -e ": linear-body drop ; : linear-function drop ; ' linear-body declareLinearSafeXT ' linear-function declareLinearSafeXT ' linear-body makeTHUNK assertLinear ' linear-function makeTHUNK assertLinear pass drop bye"
          gforth data/FLib.fth -e ": linear-body drop ; : linear-function drop ; : check-linear-move { child fn -- } child fn pass drop child metadata@ META-STATE cells + @ OWN-CONSUMED <> abort\" linear capture was not consumed\" ; ' linear-body declareLinearSafeXT ' linear-function declareLinearSafeXT ' linear-body makeTHUNK assertLinear ' linear-function makeTHUNK assertLinear check-linear-move bye"
          gforth data/FLib.fth -e ": assert30 30 <> IF abort THEN ; : add2 + ; ' add2 makeTHUNK 10 swap pass 20 swap pass dethunk assert30 bye"

      - name: Reject modal wrapper around a linear payload
        run: |
          set +e
          output=$(gforth data/FLib.fth -e ": linear-body drop ; ' linear-body declareLinearSafeXT ' linear-body makeTHUNK assertLinear makeRESULT assertModalValue bye" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::assertModalValue accepted a result wrapping a linear payload"
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "linear payload cannot be modal"

      - name: Accept a tracked modal scalar payload
        run: |
          gforth data/FLib.fth -e ": assert-modal-mode { h -- } h metadata@ META-MODE cells + @ MODE-MODAL <> abort\\" result wrapper lost modal mode\\" ; 123 MODE-MODAL ABI-MAKE-SCALAR makeRESULT assertModalValue assert-modal-mode bye"

      - name: Reject a tracked linear scalar as modal
        run: |
          set +e
          output=$(gforth data/FLib.fth -e "123 MODE-LINEAR ABI-MAKE-SCALAR makeRESULT assertModalValue bye" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::assertModalValue accepted a linear scalar payload"
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "linear payload cannot be modal"

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: 'latest'
          cabal-update: true

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all

      - name: Reject unsupported literals at compile time
        run: |
          set +e
          output=$(cabal run agda2forth -- -i test test/UnsupportedString.agda 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::unsupported string literal unexpectedly compiled"
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "not yet supported: String literals"

      - name: Compile first-order triples fixture
        run: cabal run agda2forth -- -i test test/TriplesFO.agda
