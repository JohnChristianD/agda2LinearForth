name: build
on: [push, pull_request]

jobs:
  build:
    name: agda2forth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GForth
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth

      - name: Check runtime ABI boundaries
        run: gforth test/gforth/abi-smoke.fs

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: 'latest'
          cabal-update: true

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all

      - name: Type-check constructive ABI state, Hoare, and separation model
        run: cabal run agda-spec-check -- --no-libraries -i formal formal/LinearModalABI.agda

      - name: Type-check constructive ABI stack-effect derivations
        run: cabal run agda-spec-check -- --no-libraries -i formal formal/LinearModalStackEffects.agda

      - name: Compile first-order triples fixture
        run: cabal run agda2forth -- -i test test/TriplesFO.agda
