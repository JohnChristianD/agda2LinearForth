name: build
on: [push, pull_request]

jobs:
  build:
    name: agda2forth
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify per-file upstream source identity
        env:
          SCHEME_UPSTREAM_SHA: 6b3d975e9274448c09b5939e637b6718c2cfb10c
          FORTH_UPSTREAM_SHA: e83f8cc735bf220f80b3655ce2158a23818910fe
          FLIB_BASELINE_BLOB: 74d167b9d69d172f11d8ea71783dbaf4c25c3262
        run: |
          git fetch --no-tags --depth=1 https://github.com/jespercockx/agda2scheme.git "$SCHEME_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SCHEME_UPSTREAM_SHA"
          git diff --exit-code "$SCHEME_UPSTREAM_SHA" HEAD -- app/Main.hs src/Agda/Compiler/Erase.hs

          git fetch --no-tags --depth=1 https://github.com/LMMilliken/agda2Forth.git "$FORTH_UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FORTH_UPSTREAM_SHA"
          git diff --exit-code "$FORTH_UPSTREAM_SHA" HEAD -- src/Main.hs src/Agda/Compiler/ToForth.hs

          # The runtime dispatch table in LinearModalSafety.agda mirrors this exact baseline.
          test "$(git hash-object data/FLib.fth)" = "$FLIB_BASELINE_BLOB"

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.0.2'
          cabal-version: '3.10.3.0'
          cabal-update: true

      - name: Configure the build
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal build --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v3
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # Agda 2.6.2.2's setup hook needs the Agda executable while installing
      # interface files. Install the CLI before Cabal builds library-only deps.
      - name: Install Agda CLI for formal checks
        run: |
          mkdir -p "$HOME/.local/bin"
          cabal install Agda-2.6.2.2 --installdir="$HOME/.local/bin" --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda" --version

      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v3
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all

      - name: Set up GForth
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth

      - name: Check runtime ABI boundaries
        run: gforth -e 'include data/FLib.fth' -e 'include test/gforth/abi-smoke.fs'

      - name: Type-check unified WP, ABI, denotation, and separation proofs
        run: |
          "$HOME/.local/bin/agda" --safe --no-libraries -i formal formal/LinearModalSafety.agda

      - name: Verify unsupported-literal output preserves the unchanged compiler boundary
        run: |
          cabal run agda2forth -- -i test test/UnsupportedLiteral.agda
          grep -Fq 'not yet supported: String literals' UnsupportedLiteral.fth
          grep -Eq '(^|[[:space:]])bye([[:space:]]|$)' UnsupportedLiteral.fth

      - name: Compile and execute a generated scalar through the checked ABI
        run: |
          cabal run agda2forth -- -i test test/CheckedScalar.agda
          echo "---- generated CheckedScalar.fth (diagnostic) ----"
          cat CheckedScalar.fth
          echo >> CheckedScalar.fth
          cat >> CheckedScalar.fth <<'FORTH_DEBUG'
          : trace-value { h -- }
            0 { layer }
            BEGIN
              ." LAYER " layer . ." HANDLE " h . cr
              h metadata@ { meta }
              meta 0= IF ." RAW " h . cr EXIT THEN
              meta META-KIND cells + @ { kind }
              ." KIND " kind . ." MODE " meta META-MODE cells + @ .
              ." ENVS " meta META-ENVCOUNT cells + @ . cr
              kind KIND-SCALAR = IF
                h ABI-SCALAR-INFO { payload mode ignored }
                ." SCALAR " payload . ." MODE " mode . cr EXIT
              THEN
              kind KIND-BOOLEAN = IF
                h ABI-BOOL-INFO { payload mode ignored }
                ." BOOL " payload . ." MODE " mode . cr EXIT
              THEN
              h isThunk 0= IF ." NOT THUNK" cr EXIT THEN
              h dethunk TO h
              layer 1+ TO layer
            AGAIN ;
          1 ABI-TRACE !
          1 ABI-CHECKED-MODE !
          scalarAnswer trace-value
          0 ABI-CHECKED-MODE !
          FORTH_DEBUG
          echo "---- runtime result ----"
          gforth CheckedScalar.fth test/gforth/generated-scalar-smoke.fs

      - name: Compile first-order triples fixture
        run: cabal run agda2forth -- -i test test/TriplesFO.agda
